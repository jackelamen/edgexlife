<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16150f" />
    <!-- Applies a manually-chosen theme (see src/lib/theme.js) before the
         stylesheet or any React code runs, so switching themes — or a
         page load on a device with one already set — never flashes the
         other theme first. Keep the localStorage key ('xlife-theme') and
         the values ('light'/'dark') in sync with theme.js by hand; this
         has to stay a plain inline script, not an import, to run this
         early. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('xlife-theme')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (e) { /* private mode / storage disabled */ }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Bricolage Grotesque — one family, optical-size axis carries the whole
         scale from 11px labels to 40px display. 2026-08 redesign. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <title>xLife</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
